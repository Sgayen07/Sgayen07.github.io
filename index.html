<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pragyan - TXT/Markdown Q&A Exporter</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; font-family: Arial, "Noto Sans Bengali", sans-serif; background:#f5f7fb; color:#1f2937; }
  .wrap { max-width:1050px; margin:32px auto; padding:0 18px; }
  .card { background:#fff; border-radius:14px; padding:24px; box-shadow:0 4px 18px rgba(0,0,0,.08); }
  h1 { margin:0 0 8px; font-size:30px; }
  h2 { margin-top:26px; }
  .muted { color:#6b7280; }
  input[type=file] { margin:18px 0; width:100%; padding:12px; border:1px solid #d1d5db; border-radius:8px; background:#fafafa; }
  .status { padding:12px 14px; border-radius:8px; margin:14px 0; display:none; }
  .success { background:#ecfdf5; color:#065f46; display:block; }
  .warning { background:#fffbeb; color:#92400e; display:block; }
  .error { background:#fef2f2; color:#991b1b; display:block; }
  .header, .row { display:grid; grid-template-columns:70px 1fr 180px; gap:12px; align-items:center; }
  .header { font-weight:bold; padding:10px 0; border-bottom:2px solid #e5e7eb; }
  .row { padding:13px 0; border-bottom:1px solid #eee; }
  .q { white-space:pre-wrap; }
  button { border:0; border-radius:8px; padding:12px 18px; cursor:pointer; font-weight:600; margin:6px 8px 0 0; }
  .primary { background:#2563eb; color:#fff; }
  .secondary { background:#111827; color:#fff; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .exports { display:none; margin-top:20px; }
  .math { font-family: "Times New Roman", serif; color:#b91c1c; }
  @media(max-width:700px){ .header,.row{grid-template-columns:55px 1fr 110px;font-size:14px;} }
</style>
<!-- Client-side libraries. GitHub Pages can serve this file directly. -->
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
</head>
<body>
<div class="wrap">
<div class="card">
<h1>📄 TXT/Markdown Q&A Exporter</h1>
<p class="muted">Upload a <b>.txt</b> or <b>.md</b> file. Questions should start with <b>Q:</b> (or <b>প্র:</b>) and answers with <b>A:</b> (or <b>উ:</b>).</p>
<input id="file" type="file" accept=".txt,.md,text/plain,text/markdown">
<div id="status" class="status"></div>
<div id="app" style="display:none">
<h2>Select Questions</h2>
<div class="header"><div>Select</div><div>Question</div><div>Render Math as Images</div></div>
<div id="questions"></div>
<div id="actions">
<button class="primary" id="generate">🚀 Generate Files</button>
</div>
<div id="exports" class="exports">
<div class="status success">Files are ready for download!</div>
<button class="secondary" id="ppt">📥 Download PowerPoint</button>
<button class="secondary" id="pdf">📥 Download PDF</button>
</div>
</div>
</div>
</div>

<script>
let qaList = [];

function isBengali(text) { return /[\u0980-\u09FF]/.test(text); }

function formatOptions(text) {
  text = text.replace(/\n/g, ' ');
  for(let i=0;i<4;i++) text = text.replace(/\s+/g,' ');
  text = text.replace(/(\s+[\(]?[ক-ঘA-D][\)\.])/g, '\\n$1');
  return text.trim();
}

function cleanMarkdown(text) {
  text = text.replace(/^#+\s*/gm,'');
  text = text.replace(/\*\*(.*?)\*\*/g,'$1').replace(/\*(.*?)\*/g,'$1');
  text = text.replace(/__(.*?)__/g,'$1').replace(/_(.*?)_/g,'$1');
  text = text.replace(/\[(.*?)\]\(.*?\)/g,'$1');
  text = text.replace(/\\text\{([^}]*)\}/g,'$1');
  text = text.replace(/\\text/g,'').replace(/\\backslash/g,'');
  text = text.replace(/\\\{/g,'').replace(/\\\}/g,'');
  text = text.replace(/\$/g,'');
  text = text.replace(/\\frac\{([^}]*)\}\{([^}]*)\}/g,'($1) / ($2)');
  text = text.replace(/\\beta/g,'β').replace(/\\theta/g,'θ').replace(/\\geq/g,'≥')
             .replace(/\\leq/g,'≤').replace(/\\mid/g,'|').replace(/\\alpha/g,'α')
             .replace(/\\mu/g,'μ').replace(/\\sigma/g,'σ');
  text = text.replace(/H_0/g,'H0').replace(/H_1/g,'H1');
  text = text.replace(/Size=1/g,'size = 1');
  return text.replace(/\u00a0/g,' ').replace(/\u200b/g,'').replace(/\s+/g,' ').trim();
}

function parseMarkdown(md) {
  const pattern = /(?:Q:|Question:?|প্র:|প্রশ্ন:?)\s*(.*?)\s*(?:A:|Answer:?|উ:|উত্তর:?)\s*(.*?)(?=(?:Q:|Question:?|প্র:|প্রশ্ন:?)|$)/gis;
  const out=[]; let m;
  while((m=pattern.exec(md))!==null) out.push({question:m[1].trim(), answer:m[2].trim()});
  return out;
}

function setStatus(msg, type) {
  const s=document.getElementById('status'); s.className='status '+type; s.textContent=msg;
}

function renderQuestions() {
  const box=document.getElementById('questions'); box.innerHTML='';
  qaList.forEach((qa,i)=>{
    const row=document.createElement('div'); row.className='row';
    row.innerHTML=`<div><input type="checkbox" class="sel" data-i="${i}" checked></div>
      <div class="q"><b>Q:</b> ${escapeHtml(qa.question)}</div>
      <div><input type="checkbox" class="math" data-i="${i}"></div>`;
    box.appendChild(row);
  });
}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}

document.getElementById('file').addEventListener('change', async e=>{
  const f=e.target.files[0]; if(!f)return;
  const text=await f.text(); qaList=parseMarkdown(text);
  if(!qaList.length){setStatus('No questions found in the file. Please ensure you use the correct format.','warning');return;}
  setStatus(`Successfully loaded ${qaList.length} questions from the file!`,'success');
  document.getElementById('app').style.display='block'; renderQuestions();
});

function selected() {
  return [...document.querySelectorAll('.sel:checked')].map(x=>+x.dataset.i);
}

document.getElementById('generate').addEventListener('click',()=>{
  if(!selected().length){setStatus('Please select at least one question to generate files.','error');return;}
  document.getElementById('exports').style.display='block';
  setStatus('Files are ready for download!','success');
});

function questionText(qa){ return (isBengali(qa.question)?'প্রশ্ন: ':'Question: ')+formatOptions(cleanMarkdown(qa.question)); }
function answerText(qa){ return (isBengali(qa.answer)?'উত্তর: ':'Answer: ')+cleanMarkdown(qa.answer); }

document.getElementById('ppt').addEventListener('click', async ()=>{
  const ids=selected(); if(!ids.length)return;
  const pptx=new pptxgen(); pptx.layout='LAYOUT_WIDE'; pptx.author='Pragyan';
  pptx.subject='TXT/Markdown Q&A Export';
  ids.forEach((idx,n)=>{
    const qa=qaList[idx], slide=pptx.addSlide();
    slide.addText((isBengali(qa.question)?'প্রশ্ন: ':'Question: ')+(n+1),{x:0.7,y:0.35,w:11.5,h:.45,fontSize:22,bold:true});
    const q=questionText(qa), a=answerText(qa);
    slide.addText(q,{x:0.9,y:1.3,w:11.2,h:1.6,fontSize:20,color:'FF0000',breakLine:false,margin:0,fit:'shrink'});
    slide.addText(a,{x:0.9,y:3.0,w:11.2,h:2.5,fontSize:20,color:'000000',margin:0,fit:'shrink'});
  });
  await pptx.writeFile({fileName:'Pragyan_Q&A.pptx'});
});

document.getElementById('pdf').addEventListener('click', async ()=>{
  const ids=selected(); if(!ids.length)return;
  const {jsPDF}=window.jspdf; const pdf=new jsPDF({orientation:'p',unit:'pt',format:'a4'});
  for(let n=0;n<ids.length;n++){
    if(n)pdf.addPage();
    const qa=qaList[ids[n]];
    const container=document.createElement('div');
    container.style.cssText='position:fixed;left:-10000px;top:0;width:760px;padding:55px;background:white;font-family:Arial,"Noto Sans Bengali",sans-serif;font-size:20px;line-height:1.55;';
    container.innerHTML=`<div style="font-size:22px;font-weight:bold;margin-bottom:24px;">${escapeHtml((isBengali(qa.question)?'প্রশ্ন: ':'Question: ')+(n+1))}</div>
      <div style="color:red;margin-bottom:25px;white-space:pre-wrap;">${escapeHtml(questionText(qa))}</div>
      <div style="white-space:pre-wrap;">${escapeHtml(answerText(qa))}</div>`;
    document.body.appendChild(container);
    const canvas=await html2canvas(container,{scale:2,backgroundColor:'#fff'});
    document.body.removeChild(container);
    const img=canvas.toDataURL('image/png');
    const pageW=pdf.internal.pageSize.getWidth(), pageH=pdf.internal.pageSize.getHeight();
    const ratio=Math.min((pageW-60)/canvas.width,(pageH-60)/canvas.height);
    pdf.addImage(img,'PNG',30,30,canvas.width*ratio,canvas.height*ratio);
  }
  pdf.save('Pragyan_Q&A.pdf');
});
</script>
</body>
</html>
